# GitHub Pages: https://ozguradmin.github.io/ahenk-cep-pdfreader/
#
# Publishes site/ as it is in git, after the unit tests pass. It is a project page of its own, next to
# https://ozguradmin.github.io/ahenk-turkish-tts/ and independent of it: its own folder, its own service worker scope.
# GitHub Pages cannot send COOP/COEP headers; site/coi-serviceworker.js gives the page cross-origin isolation.
# The model is never in the repo: the page loads it from the Hugging Face model repo.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions
name: pages

on:
  push:
    paths: ["site/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # only the default branch publishes
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Sanity checks (no root-absolute paths, service worker next to the page)
        run: |
          test -f site/coi-serviceworker.js
          ! grep -nE '(href|src)="/[^/]' site/index.html
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
